<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Booking Chi tiết | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('booking')}"></div>

<main class="container py-5">
    <div class="row g-4">
        <aside th:replace="~{fragments/sidebar :: accountSidebar('bookings')}"></aside>

        <section class="col-lg-9">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h1 class="gs-h1 section-title mb-1" th:text="'Booking BK-' + ${booking.id}"> Lịch hẹn </h1>
                    <p class="text-secondary mb-0">Xem lại chi tiết lịch hẹn và các dịch vụ đã chọn.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/booking/my-bookings}"> Quay lại </a>
            </div>

            <div th:replace="~{fragments/sidebar :: historyTabs('bookings')}"></div>

            <div class="surface-card gs-stripe-top p-4 mb-4">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="small text-secondary">Ngày và giờ</div>
                        <div class="fw-bold gs-mono" th:text="${booking.bookingDate + ' - ' + booking.timeSlot}"> Ngày </div>
                    </div>
                    <div class="col-md-4">
                        <div class="small text-secondary"> Trạng thái </div>
                        <span class="gs-badge"
                              th:classappend="${booking.bookingStatus.name() == 'PENDING_PAYMENT'} ? 'gs-badge--neutral' : (${booking.bookingStatus.name() == 'CONFIRMED'} ? 'gs-badge--info' : (${booking.bookingStatus.name() == 'IN_PROGRESS'} ? 'gs-badge--warning' : (${booking.bookingStatus.name() == 'COMPLETED'} ? 'gs-badge--success' : 'gs-badge--danger')))"
                              th:text="${booking.bookingStatus}">Chờ xử lý</span>
                    </div>
                    <div class="col-md-4">
                        <div class="small text-secondary"> Xe </div>
                        <div class="fw-bold gs-mono"
                             th:text="${booking.vehicle != null ? booking.vehicle.brand + ' ' + booking.vehicle.modelName + ' ' + booking.vehicle.year + ' - ' + booking.vehicle.licensePlate : 'Chưa chọn xe'}"> Xe </div>
                    </div>
                    <div class="col-12">
                        <div class="small text-secondary"> Ghi chú </div>
                        <div th:text="${booking.notes ?: 'Không có ghi chú'}"> Ghi chú </div>
                    </div>
                </div>
            </div>

            <div class="surface-card p-4">
                <h4 class="gs-h4 fw-bold mb-3"> Dịch vụ </h4>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th> Dịch vụ </th>
                            <th> Mô tả </th>
                            <th class="text-end">Giá khởi điểm</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="detail : ${bookingServices}">
                            <td class="fw-bold" th:text="${detail.serviceNameSnapshot}"> Dịch vụ </td>
                            <td th:text="${detail.service.description ?: 'Chưa có mô tả'}"> Mô tả </td>
                            <td class="text-end fw-bold gs-mono"
                                th:text="${#numbers.formatDecimal(detail.minPriceSnapshot, 0, 'COMMA', 0, 'POINT')} + ' VND'">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
