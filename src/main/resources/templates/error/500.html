<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Lỗi Hệ Thống  | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments :: navbar('error')}"></div>

<main class="auth-shell gs-grid-texture d-flex align-items-center py-5 text-center">
    <div class="container">
        <div class="py-5">
            <div class="gs-mono fw-bold mb-3" style="font-size: clamp(4rem, 12vw, 8rem); color: var(--gs-amber); line-height: 1;">500</div>
            <h1 class="gs-h1 text-white mb-3"> Đã xảy ra lỗi phía máy chủ </h1>
            <p class="mb-4 mx-auto" style="max-width: 480px; color: #dbe4f0;">
                Chúng tôi chân thành xin lỗi, hệ thống đã gặp sự cố trong quá trình xử lý yêu cầu của bạn.
                Đội ngũ kỹ thuật đã được thông báo. Vui lòng thử lại sau vài phút.
            </p>
            <div class="d-flex justify-content-center flex-wrap gap-3">
                <a class="btn btn-primary btn-lg gs-cut" th:href="@{/}"><i class="bi bi-house-door me-2"></i> Về trang chủ </a>
                <a class="btn btn-outline-light btn-lg" href="javascript:location.reload()"><i class="bi bi-arrow-clockwise me-2"></i> Thử lại </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
