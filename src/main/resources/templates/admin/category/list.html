<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quản Lý Danh Mục | GearShift Admin')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<div class="container-fluid py-4">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('categories')}"></aside>

        <main class="col-md-9 col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <div>
                    <h1 class="h2 fw-bold text-dark"><i class="bi bi-tags me-2 text-primary"></i>Quản Lý Danh Mục</h1>
                    <p class="text-secondary small mb-0">Danh sách các danh mục phụ tùng xe ô tô trong hệ thống.</p>
                </div>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/admin/categories/create}" class="btn btn-primary shadow-sm d-flex align-items-center gap-2">
                        <i class="bi bi-plus-lg"></i>
                        <span>Thêm Danh Mục Mới</span>
                    </a>
                </div>
            </div>

            <!-- Bảng danh sách danh mục -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="py-3 ps-4" style="width: 80px;">ID</th>
                                <th class="py-3" style="width: 250px;">Tên Danh Mục</th>
                                <th class="py-3">Mô Tả</th>
                                <th class="py-3 text-end pe-4" style="width: 180px;">Thao Tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="4" class="text-center py-5 text-secondary">
                                    <i class="bi bi-folder-x display-4 d-block mb-2 text-muted opacity-50"></i>
                                    Chưa có danh mục nào trong hệ thống.
                                </td>
                            </tr>
                            <tr th:each="cat : ${categories}">
                                <td class="ps-4 fw-bold text-secondary" th:text="${cat.id}">1</td>
                                <td>
                                    <span class="fw-semibold text-dark fs-6" th:text="${cat.categoryName}">Performance Parts</span>
                                </td>
                                <td class="text-secondary small" th:text="${cat.description ?: 'Chưa có mô tả'}">Mô tả danh mục</td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-outline-primary btn-sm me-1" title="Chỉnh sửa">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" 
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');" 
                                       class="btn btn-outline-danger btn-sm" title="Xóa">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
