<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Orders | Admin')}"></head>
<body>
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold m-0">Order Management</h1>

        <form method="get" th:action="@{/admin/orders}" class="d-flex gap-2">
            <select name="status" class="form-select" onchange="this.form.submit()">
                <option value="">All Statuses</option>
                <option value="PENDING" th:selected="${param.status != null and param.status[0] == 'PENDING'}">Pending</option>
                <option value="PROCESSING" th:selected="${param.status != null and param.status[0] == 'PROCESSING'}">Processing</option>
                <option value="SHIPPED" th:selected="${param.status != null and param.status[0] == 'SHIPPED'}">Shipped</option>
                <option value="DELIVERED" th:selected="${param.status != null and param.status[0] == 'DELIVERED'}">Delivered</option>
                <option value="CANCELLED" th:selected="${param.status != null and param.status[0] == 'CANCELLED'}">Cancelled</option>
            </select>
        </form>
    </div>

    <div class="surface-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td class="fw-bold" th:text="${'#' + order.id}">#1</td>
                    <td th:text="${order.user.fullName}"></td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></td>
                    <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 2, 'POINT')}">$0</td>
                    <td>
                            <span class="badge text-uppercase"
                                  th:classappend="${order.status == 'PENDING' ? 'bg-warning text-dark' :
                                                   (order.status == 'PROCESSING' ? 'bg-primary' :
                                                   (order.status == 'SHIPPED' ? 'bg-info text-dark' :
                                                   (order.status == 'DELIVERED' ? 'bg-success' : 'bg-danger')))}"
                                  th:text="${order.status}">PENDING</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-eye me-1"></i> Detail
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="6" class="text-center text-secondary py-4">No orders found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
