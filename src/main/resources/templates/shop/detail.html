<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${product.productName + ' | GearShift Pro'})}"></head>
<body>
<div th:replace="~{fragments :: navbar('shop')}"></div>

<main class="container py-5">
    <div class="row g-5">
        <div class="col-lg-6">
            <div class="surface-card overflow-hidden bg-light d-flex align-items-center justify-content-center" style="min-height: 360px">
                <img class="w-100" th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                     th:src="${product.imageUrl}" alt="Product image">
                <i class="bi bi-tools display-1 text-secondary" th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}"></i>
            </div>
        </div>
        <div class="col-lg-6">
            <span class="badge badge-fit mb-3" th:text="${product.category.categoryName}">Category</span>
            <h1 class="section-title" th:text="${product.productName}">Product</h1>
            <p class="lead text-secondary" th:text="${product.description ?: 'No description available.'}">Description</p>
            <div class="price display-6 mb-4" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">$0</div>
            <div class="row g-3 mb-4">
                <div class="col-sm-4">
                    <div class="surface-card p-3">
                        <div class="small text-secondary">Stock</div>
                        <strong th:text="${product.stockQuantity}">0</strong>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="surface-card p-3">
                        <div class="small text-secondary">Status</div>
                        <strong th:text="${product.status}">ACTIVE</strong>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="surface-card p-3">
                        <div class="small text-secondary">Category</div>
                        <strong th:text="${product.category.categoryName}">Parts</strong>
                    </div>
                </div>
            </div>
            <form class="d-flex flex-wrap gap-2" th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input class="form-control form-control-lg" style="max-width: 120px" type="number" name="quantity" value="1" min="1"
                       th:max="${product.stockQuantity}">
                <button class="btn btn-primary btn-lg" type="submit" th:disabled="${product.stockQuantity <= 0}">
                    <i class="bi bi-cart-plus me-2"></i>Add to Cart
                </button>
                <a class="btn btn-outline-primary btn-lg" th:href="@{/shop}">Back to Shop</a>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
