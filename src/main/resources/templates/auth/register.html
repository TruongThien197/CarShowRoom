<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments :: navbar('login')}"></div>

<main class="auth-shell gs-grid-texture d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-end">
            <div class="col-lg-6">
                <form class="surface-card gs-stripe-top p-4 p-md-5 needs-validation" th:action="@{/auth/register}" method="post" novalidate>
                    <h1 class="gs-h1 section-title mb-2">Tạo tài khoản</h1>
                    <p class="text-secondary mb-4">Lưu xe, theo dõi đơn hàng và đặt lịch sửa chữa nhanh hơn.</p>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label"> Họ và tên </label>
                            <input class="form-control" type="text" name="txtfullName" maxlength="150" required>
                            <div class="invalid-feedback">Họ và tên là bắt buộc.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label"> Email </label>
                            <input class="form-control" type="email" name="txtEmail" maxlength="255" required>
                            <div class="invalid-feedback">Vui lòng nhập địa chỉ email hợp lệ.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"> Mật khẩu </label>
                            <input class="form-control" type="password" name="txtPassword" minlength="6" maxlength="50" required>
                            <div class="invalid-feedback">Mật khẩu phải có từ 6 đến 50 ký tự.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"> Số điện thoại </label>
                            <input class="form-control" type="tel" name="txtPhone" pattern="[0-9]{9,15}" maxlength="15">
                        </div>
                        <div class="col-12">
                            <label class="form-label"> Địa chỉ </label>
                            <input class="form-control" type="text" name="txtAddress" maxlength="500">
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary btn-lg w-100" type="submit"> Đăng ký </button>
                        </div>
                    </div>
                    <p class="text-center mt-4 mb-0">Đã có tài khoản? <a th:href="@{/auth/login}"> Đăng nhập </a></p>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
