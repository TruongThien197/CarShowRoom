<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Account | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments :: navbar('account')}"></div>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
        <div>
            <h1 class="section-title">My Account</h1>
            <p class="text-secondary mb-0">Dashboard for profile, vehicles, bookings, and orders.</p>
        </div>
        <a class="btn btn-primary align-self-start" th:href="@{/booking}">
            <i class="bi bi-calendar-plus me-2"></i>New Booking
        </a>
    </div>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="surface-card p-4 h-100">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="icon-box fs-4"><i class="bi bi-person"></i></div>
                    <div>
                        <h5 class="fw-bold mb-0" th:text="${user.fullName}">Customer</h5>
                        <span class="text-secondary" th:text="${user.role}">Role</span>
                    </div>
                </div>
                <p><i class="bi bi-envelope me-2 text-primary"></i><span th:text="${user.email}">email@example.com</span></p>
                <p><i class="bi bi-telephone me-2 text-primary"></i><span th:text="${user.phone ?: 'No phone'}">Phone</span></p>
                <p class="mb-0"><i class="bi bi-geo-alt me-2 text-primary"></i><span th:text="${user.address ?: 'No address'}">Address</span></p>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="surface-card p-4">
                        <div class="text-secondary">Orders</div>
                        <div class="display-6 fw-bold text-primary" th:text="${ordersCount}">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="surface-card p-4">
                        <div class="text-secondary">Bookings</div>
                        <div class="display-6 fw-bold text-primary" th:text="${bookingsCount}">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="surface-card p-4">
                        <div class="text-secondary">Vehicles</div>
                        <div class="display-6 fw-bold text-primary" th:text="${vehiclesCount}">0</div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="surface-card p-4 d-flex flex-wrap gap-2">
                        <a class="btn btn-outline-primary" th:href="@{/orders}"><i class="bi bi-receipt me-2"></i>Order History</a>
                        <a class="btn btn-outline-primary" th:href="@{/booking}"><i class="bi bi-calendar-check me-2"></i>Booking History</a>
                        <a class="btn btn-outline-primary" th:href="@{/cart}"><i class="bi bi-cart3 me-2"></i>Shopping Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
