<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Add Vehicle | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('account')}"></div>

<main class="container py-5">
    <div class="row g-4">
        <aside th:replace="~{fragments/sidebar :: accountSidebar('vehicles')}"></aside>

        <section class="col-lg-9">
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h1 class="gs-h1 section-title mb-1"> Thêm xe </h1>
                    <p class="text-secondary mb-0">Nhập thông tin xe của bạn.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/vehicles}"> Quay lại </a>
            </div>

            <form class="surface-card p-4 p-md-5" th:action="@{/vehicles}" th:object="${vehicleForm}" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label"> Hãng xe </label>
                        <input class="form-control" th:field="*{brand}" placeholder="BMW, Toyota..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label"> Mẫu xe </label>
                        <input class="form-control" th:field="*{modelName}" placeholder="M4 G82, Supra GR..." required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label"> Năm </label>
                        <input class="form-control gs-mono" th:field="*{year}" type="number" min="1886" max="2030" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">License Plate</label>
                        <input class="form-control gs-mono" th:field="*{licensePlate}" required>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-car-front me-2"></i>Lưu Vehicle
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
