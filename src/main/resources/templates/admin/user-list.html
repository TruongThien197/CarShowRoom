<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('User Management | GearShift Pro')}"></head>
<body class="ops-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container-fluid">
    <div class="row">
        <aside class="col-lg-3 col-xl-2 ops-sidebar p-4">
            <h5 class="text-white fw-bold mb-4">Admin Panel</h5>
            <nav class="d-grid gap-2">
                <a th:href="@{/admin}"><i class="bi bi-speedometer2"></i>Dashboard</a>
                <a class="active" th:href="@{/admin/users}"><i class="bi bi-people"></i>Users</a>
            </nav>
        </aside>

        <section class="col-lg-9 col-xl-10 p-4 p-lg-5">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="section-title mb-1">User Management</h1>
                    <p class="text-secondary mb-0">Create staff accounts, manage customers, and control account status.</p>
                </div>
                <a class="btn btn-primary align-self-start" th:href="@{/admin/users/create}">
                    <i class="bi bi-person-plus me-2"></i>Add User
                </a>
            </div>

            <div class="surface-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td class="fw-bold" th:text="${user.id}">1</td>
                            <td>
                                <div class="fw-bold" th:text="${user.fullName}">User</div>
                                <div class="small text-secondary" th:text="${user.email}">email@example.com</div>
                            </td>
                            <td th:text="${user.phone ?: 'No phone'}">Phone</td>
                            <td><span class="badge text-bg-light" th:text="${user.role}">CUSTOMER</span></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.status == 'ACTIVE'} ? ' text-bg-success' : ' text-bg-secondary'"
                                      th:text="${user.status}">ACTIVE</span>
                            </td>
                            <td class="text-end table-action">
                                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/users/{id}(id=${user.id})}">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/users/edit/{id}(id=${user.id})}">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a class="btn btn-outline-danger btn-sm"
                                   th:if="${user.status == 'ACTIVE'}"
                                   th:href="@{/admin/users/{id}/change-status(id=${user.id})}">Lock</a>
                                <a class="btn btn-outline-success btn-sm"
                                   th:if="${user.status != 'ACTIVE'}"
                                   th:href="@{/admin/users/{id}/change-status(id=${user.id})}">Unlock</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
