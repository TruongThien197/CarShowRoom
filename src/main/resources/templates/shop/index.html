<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('GearShift Pro | Shop')}"></head>
<body>
<div th:replace="~{fragments :: navbar('shop')}"></div>

<main class="container-fluid">
    <div class="row min-vh-100">
        <aside class="col-lg-3 col-xl-2 apex-sidebar p-4">
            <div class="surface-card p-3 mb-4 bg-primary text-white">
                <div class="small opacity-75">SHOP FILTER</div>
                <div class="fw-bold fs-5">Performance Parts</div>
            </div>
            <div class="list-group">
                <a class="list-group-item" th:classappend="${selectedCategoryId == null} ? 'active'" th:href="@{/shop}">
                    <i class="bi bi-grid me-2"></i>All Categories
                </a>
                <a class="list-group-item"
                   th:each="category : ${categories}"
                   th:classappend="${selectedCategoryId == category.id} ? 'active'"
                   th:href="@{/shop(categoryId=${category.id})}">
                    <i class="bi bi-gear-wide-connected me-2"></i>
                    <span th:text="${category.categoryName}">Category</span>
                </a>
            </div>
        </aside>

        <section class="col-lg-9 col-xl-10 p-4 p-lg-5">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
                <div>
                    <h1 class="section-title">Performance Parts</h1>
                    <p class="text-secondary mb-0">Browse active products from the showroom catalog.</p>
                </div>
                <form class="d-flex gap-2" th:action="@{/shop}" method="get">
                    <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search product">
                    <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search me-2"></i>Search</button>
                </form>
            </div>

            <div class="alert alert-light border" th:if="${#lists.isEmpty(products)}">
                No active products found.
            </div>

            <div class="row g-4" th:if="${!#lists.isEmpty(products)}">
                <div class="col-md-6 col-xl-4" th:each="product : ${products}">
                    <div class="surface-card product-card overflow-hidden h-100">
                        <img class="w-100 product-image"
                             th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                             th:src="${product.imageUrl}" alt="Product image">
                        <div class="p-4">
                            <span class="badge badge-fit mb-2">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${product.category.categoryName}">Category</span>
                            </span>
                            <div class="d-flex justify-content-between gap-3">
                                <h5 class="fw-bold" th:text="${product.productName}">Part name</h5>
                                <span class="text-secondary small" th:text="'Stock: ' + ${product.stockQuantity}">Stock</span>
                            </div>
                            <p class="text-secondary small" th:text="${product.description ?: 'No description available.'}">
                                Product description
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">$0</span>
                                <a class="btn btn-primary" th:href="@{/products/{id}(id=${product.id})}">
                                    <i class="bi bi-eye me-2"></i>Detail
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
