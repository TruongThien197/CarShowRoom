<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Dòng xe tương thích | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('car-models')}"></aside>
        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3">
                <div>
                    <h1 class="admin-page-title mb-1"><i class="bi bi-car-front me-2 text-primary"></i>Dòng xe tương thích</h1>
                    <p class="text-secondary small mb-0">Danh mục dòng xe dùng để gán và lọc sản phẩm, không phải xe riêng của khách hàng.</p>
                </div>
                <a class="btn btn-outline-primary" th:href="@{/admin/products}">Quản lý sản phẩm</a>
            </div>

            <form class="surface-card gs-stripe-top p-4 mb-4" th:action="@{/admin/car-models}" method="post">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label"> Hãng xe </label>
                        <input class="form-control" name="brand" placeholder="Toyota" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label"> Mẫu xe </label>
                        <input class="form-control" name="modelName" placeholder="Camry" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label"> Năm </label>
                        <input class="form-control" name="year" type="number" min="1900" placeholder="2024" required>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button class="btn btn-primary" type="submit"> Thêm </button>
                    </div>
                </div>
            </form>

            <form class="surface-card p-3 mb-4" th:action="@{/admin/car-models}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-9">
                        <label class="form-label fw-semibold" for="carModelKeyword">Tìm kiếm loại xe</label>
                        <input id="carModelKeyword" class="form-control" name="keyword" th:value="${keyword}"
                               placeholder="Nhập hãng xe, mẫu xe hoặc năm (ví dụ: Toyota, Camry, 2024)">
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1" type="submit">
                            <i class="bi bi-search me-1"></i>Tìm kiếm
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/car-models}" title="Xóa bộ lọc">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </div>
                <div class="form-text mt-2" th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                     th:text="'Kết quả tìm kiếm cho: ' + keyword"></div>
            </form>

            <div class="admin-table-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">STT</th>
                            <th> Hãng xe </th>
                            <th> Mẫu xe </th>
                            <th> Năm </th>
                            <th class="text-end pe-4"> Thao tác </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(carModels)}">
                            <td colspan="5" class="gs-empty-state">
                                <div class="gs-empty-state-icon"><i class="bi bi-car-front"></i></div>
                                <div class="gs-empty-state-title" th:text="${keyword != null and !#strings.isEmpty(keyword)} ? 'Không tìm thấy dòng xe' : 'Chưa có dòng xe'">Chưa có dòng xe</div>
                                <div class="gs-empty-state-text" th:text="${keyword != null and !#strings.isEmpty(keyword)} ? 'Hãy thử từ khóa khác.' : 'Chưa có dòng xe nào trong danh mục.'">Chưa có dòng xe nào trong danh mục.</div>
                            </td>
                        </tr>
                        <tr th:each="model, stat : ${carModels}">
                            <td class="ps-4 fw-bold gs-mono text-secondary" th:text="${stat.count}">1</td>
                            <td class="fw-semibold text-dark" th:text="${model.brand}">Toyota</td>
                            <td th:text="${model.modelName}">Camry</td>
                            <td class="gs-mono" th:text="${model.year}">2024</td>
                            <td class="text-end pe-4 table-action">
                                <form class="d-inline" th:action="@{/admin/car-models/delete}" method="post" data-confirm="Bạn có chắc muốn xóa dòng xe này?">
                                    <input type="hidden" name="id" th:value="${model.id}">
                                    <button class="btn btn-outline-danger btn-sm" type="submit" title="Xóa"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
