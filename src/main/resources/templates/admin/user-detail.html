<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chi tiết người dùng | GearShift Pro')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('users')}"></aside>
        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="admin-page-title mb-1">Chi tiết người dùng</h1>
                    <p class="text-secondary mb-0">Xem thông tin tài khoản, vai trò và trạng thái.</p>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/users}"> Quay lại </a>
                    <a class="btn btn-primary" th:href="@{/admin/users/edit/{id}(id=${user.id})}">
                        <i class="bi bi-pencil me-2"></i> Sửa </a>
                </div>
            </div>

            <div class="surface-card gs-stripe-top p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="icon-box fs-4"><i class="bi bi-person"></i></div>
                    <div>
                        <h4 class="fw-bold mb-1" th:text="${user.fullName}">Người dùng</h4>
                        <div class="text-secondary gs-mono" th:text="${user.email}">email@example.com</div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="small text-secondary">Mã người dùng</div>
                        <div class="fw-bold gs-mono" th:text="${user.id}">1</div>
                    </div>
                    <div class="col-md-4">
                        <div class="small text-secondary"> Vai trò </div>
                        <span class="gs-badge"
                              th:classappend="${user.role == 'ADMIN'} ? 'gs-badge--danger' : (${user.role == 'STAFF'} ? 'gs-badge--info' : 'gs-badge--neutral')"
                              th:text="${user.role == 'ADMIN' ? 'Quản trị viên' : (user.role == 'STAFF' ? 'Nhân viên' : 'Khách hàng')}">
                        </span>
                    </div>
                    <div class="col-md-4">
                        <div class="small text-secondary"> Trạng thái </div>
                        <span class="gs-badge"
                              th:classappend="${user.status == 'ACTIVE'} ? 'gs-badge--success' : (${user.status == 'INACTIVE'} ? 'gs-badge--neutral' : 'gs-badge--danger')"
                              th:text="${user.status == 'ACTIVE' ? 'Đang hoạt động' : 'Ngừng hoạt động'}">
                        </span>
                    </div>
                    <div class="col-md-6">
                        <div class="small text-secondary"> Số điện thoại </div>
                        <div class="fw-bold gs-mono" th:text="${user.phone != null and !user.phone.isEmpty() ? user.phone : 'Chưa có số điện thoại'}"> Số điện thoại </div>
                    </div>
                    <div class="col-md-6">
                        <div class="small text-secondary"> Địa chỉ </div>
                        <div class="fw-bold" th:text="${user.address ?: 'No address'}"> Địa chỉ </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
