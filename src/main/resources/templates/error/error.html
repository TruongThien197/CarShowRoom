<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('An Error Occurred | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments :: navbar('error')}"></div>

<!-- Generic fallback for any status code not covered by error/404.html or error/500.html
     (Spring Boot's BasicErrorController resolves error/<status>.html first, then falls
     back to this file). -->
<main class="auth-shell gs-grid-texture d-flex align-items-center py-5 text-center">
    <div class="container">
        <div class="py-5">
            <div class="gs-mono fw-bold mb-3" style="font-size: clamp(4rem, 12vw, 8rem); color: var(--gs-accent); line-height: 1;" th:text="${status != null ? status : '!'}">!</div>
            <h1 class="gs-h1 text-white mb-3">An error has occurred</h1>
            <p class="mb-4 mx-auto" style="max-width: 480px; color: #dbe4f0;" th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Please return to the home page or try that action again.'">
                Please return to the home page or try that action again.
            </p>
            <a class="btn btn-primary btn-lg gs-cut" th:href="@{/}"><i class="bi bi-house-door me-2"></i>Back to Home</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
