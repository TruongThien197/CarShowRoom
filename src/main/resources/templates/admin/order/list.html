<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản lý đơn hàng | GearShift Pro')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container-fluid">
    <div class="row">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('orders')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="admin-page-title mb-1">Quản lý đơn hàng</h1>
                    <p class="text-secondary mb-0">Theo dõi đơn hàng, lọc trạng thái và mở chi tiết để cập nhật xử lý.</p>
                </div>
                <a class="btn btn-outline-secondary align-self-start" th:href="@{/admin}">
                    <i class="bi bi-speedometer2 me-2"></i>Tổng quan
                </a>
            </div>

            <form class="surface-card admin-filter-card p-3 p-md-4 mb-4" method="get" th:action="@{/admin/orders}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8 col-lg-10">
                        <label class="form-label" for="status">Trạng thái</label>
                        <select class="form-select" id="status" name="status">
                            <option value="">Tất cả trạng thái</option>
                            <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">PENDING</option>
                            <option value="PROCESSING" th:selected="${selectedStatus == 'PROCESSING'}">PROCESSING</option>
                            <option value="SHIPPED" th:selected="${selectedStatus == 'SHIPPED'}">SHIPPED</option>
                            <option value="DELIVERED" th:selected="${selectedStatus == 'DELIVERED'}">DELIVERED</option>
                            <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">CANCELLED</option>
                        </select>
                    </div>
                    <div class="col-md-4 col-lg-2 d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1" type="submit">
                            <i class="bi bi-funnel me-2"></i>Lọc
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/orders}" aria-label="Clear filters">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </div>
            </form>

            <div class="surface-card p-0 overflow-hidden">
                <div class="p-3 border-bottom">
                    <input type="search" class="form-control" style="max-width: 320px"
                           placeholder="Tìm theo khách hàng, sản phẩm..."
                           data-table-filter="#ordersTable" aria-label="Tìm đơn hàng">
                </div>
                <div class="table-responsive">
                    <table id="ordersTable" class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Mã</th>
                            <th>Khách hàng</th>
                            <th>Ngày tạo</th>
                            <th>Sản phẩm</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center text-secondary py-5">Chưa có đơn hàng phù hợp.</td>
                        </tr>
                        <tr th:each="order : ${orders}">
                            <td class="fw-bold" th:text="${'ORD-' + order.id}">ORD-1</td>
                            <td>
                                <div class="fw-bold" th:text="${order.user.fullName}">Customer</div>
                                <div class="small text-secondary" th:text="${order.user.email}">email@example.com</div>
                            </td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                            <td class="text-secondary" th:text="${orderItems[order.id] ?: 'No items'}">Items</td>
                            <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 2, 'POINT')}">0</td>
                            <td>
                                <span class="badge text-uppercase"
                                      th:classappend="${order.status == 'PENDING' ? ' text-bg-warning' : (order.status == 'PROCESSING' ? ' text-bg-primary' : (order.status == 'SHIPPED' ? ' text-bg-info' : (order.status == 'DELIVERED' ? ' text-bg-success' : ' text-bg-danger')))}"
                                      th:text="${order.status}">PENDING</span>
                            </td>
                            <td class="text-end table-action">
                                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/orders/{id}(id=${order.id})}">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
