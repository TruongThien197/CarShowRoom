<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Compatible Car Models | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('car-models')}"></aside>
        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3">
                <div>
                    <h1 class="admin-page-title mb-1"><i class="bi bi-car-front me-2 text-primary"></i>Compatible Car Models</h1>
                    <p class="text-secondary small mb-0">Catalog car models are used to assign and filter products. They are not customer-owned vehicles.</p>
                </div>
                <a class="btn btn-outline-primary" th:href="@{/admin/products}">Manage Products</a>
            </div>

            <form class="surface-card gs-stripe-top p-4 mb-4" th:action="@{/admin/car-models}" method="post">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Brand</label>
                        <input class="form-control" name="brand" placeholder="Toyota" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Model</label>
                        <input class="form-control" name="modelName" placeholder="Camry" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Year</label>
                        <input class="form-control" name="year" type="number" min="1900" placeholder="2024" required>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button class="btn btn-primary" type="submit">Add</button>
                    </div>
                </div>
            </form>

            <div class="admin-table-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>Year</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(carModels)}">
                            <td colspan="5" class="gs-empty-state">
                                <div class="gs-empty-state-icon"><i class="bi bi-car-front"></i></div>
                                <div class="gs-empty-state-title">No car models yet</div>
                                <div class="gs-empty-state-text">No car models exist in the catalog yet.</div>
                            </td>
                        </tr>
                        <tr th:each="model : ${carModels}">
                            <td class="ps-4 fw-bold gs-mono text-secondary" th:text="${model.id}">1</td>
                            <td class="fw-semibold text-dark" th:text="${model.brand}">Toyota</td>
                            <td th:text="${model.modelName}">Camry</td>
                            <td class="gs-mono" th:text="${model.year}">2024</td>
                            <td class="text-end pe-4 table-action">
                                <form class="d-inline" th:action="@{/admin/car-models/delete}" method="post" data-confirm="Delete this car model?">
                                    <input type="hidden" name="id" th:value="${model.id}">
                                    <button class="btn btn-outline-danger btn-sm" type="submit" title="Delete"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
