<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Edit Product | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('products')}"></aside>
        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3">
                <div>
                    <h1 class="gs-h1 mb-1"><i class="bi bi-pencil-square me-2 text-primary"></i> Sửa sản phẩm </h1>
                    <p class="text-secondary small mb-0 gs-mono" th:text="'ID: #' + ${product.id}">ID</p>
                </div>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                    <i class="bi bi-arrow-left"></i><span> Quay lại </span>
                </a>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <form class="surface-card gs-stripe-top p-4 p-md-5" th:action="@{/admin/products/edit/{id}(id=${product.id})}" method="post" enctype="multipart/form-data">
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Tên phụ tùng *</label>
                                <input type="text" class="form-control form-control-lg" name="productName" th:value="${product.productName}" required maxlength="200">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">SKU</label>
                                <input type="text" class="form-control form-control-lg" name="sku" th:value="${product.sku}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Danh mục *</label>
                                <select class="form-select form-select-lg" name="categoryId" required>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}"
                                            th:selected="${product.category != null and product.category.id == cat.id}"> Danh mục </option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Giá *</label>
                                <input type="number" step="1" min="0" class="form-control form-control-lg" name="price" th:value="${product.price}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Tồn kho *</label>
                                <input type="number" min="0" class="form-control form-control-lg" name="stockQuantity" th:value="${product.physicalStock}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold"> Trạng thái </label>
                                <select class="form-select form-select-lg" name="status">
                                    <option value="ACTIVE" th:selected="${product.status.name() == 'ACTIVE'}">Đang hoạt động</option>
                                    <option value="INACTIVE" th:selected="${product.status.name() == 'INACTIVE'}">Ngừng hoạt động</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Dòng xe tương thích</label>
                            <div class="car-model-select-card">
                                <div class="car-model-select-head">
                                    <span class="gs-badge gs-badge--info">Multi-select</span>
                                    <span class="text-secondary small">Nhấn vào dòng xe để bật hoặc tắt tương thích.</span>
                                    <span class="ms-auto text-secondary small car-model-count" data-car-model-count>0 selected</span>
                                </div>
                                <div class="car-model-grid">
                                    <label class="car-model-chip" th:each="model : ${carModels}">
                                        <input type="checkbox" name="carModelIds" th:value="${model.id}" class="car-model-chip-input"
                                               th:checked="${product.compatibleCarModels.contains(model)}">
                                        <span class="car-model-chip-label" th:text="${model.brand + ' ' + model.modelName + ' ' + model.year}"> Mẫu xe </span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3" th:if="${product.imageUrl}">
                            <label class="form-label fw-semibold d-block">Ảnh hiện tại</label>
                            <img th:src="${product.imageUrl}" alt="Product image" class="img-thumbnail" style="max-height: 180px">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Thay ảnh trên Firebase</label>
                            <div class="gs-file-drop">
                                <i class="bi bi-cloud-arrow-up gs-file-drop-icon"></i>
                                <input type="file" class="form-control gs-file-drop-input" name="imageFile"
                                       accept="image/jpeg,image/png,image/webp,image/gif">
                            </div>
                            <div class="form-text">Để trống để giữ ảnh hiện tại. Hỗ trợ JPG, PNG, WebP hoặc GIF; tối đa 5 MB.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">URL ảnh (không bắt buộc)</label>
                            <input type="text" class="form-control" name="imageUrl" th:value="${product.imageUrl}" placeholder="/images/turbocharger.jpg or https://...">
                            <div class="form-text">Tệp mới tải lên (nếu có) sẽ được ưu tiên hơn URL này.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold"> Mô tả </label>
                            <textarea class="form-control" name="description" rows="4" th:text="${product.description}"></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary px-4"> Hủy </a>
                            <button type="submit" class="btn btn-primary px-5"><i class="bi bi-check2-circle me-1"></i> Cập nhật </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
