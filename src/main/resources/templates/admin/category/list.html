<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quản lý danh mục | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('categories')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3">
                <div>
                    <h1 class="admin-page-title mb-1"><i class="bi bi-tags me-2 text-primary"></i>Quản lý danh mục</h1>
                    <p class="text-secondary small mb-0">Quản lý nhóm sản phẩm phụ tùng trong hệ thống.</p></div>
                <a th:href="@{/admin/categories/create}"
                   class="btn btn-primary shadow-sm d-flex align-items-center gap-2">
                    <i class="bi bi-plus-lg"></i><span>Thêm danh mục</span>
                </a>
            </div>

            <div th:replace="~{fragments/sidebar :: adminTabs('categories')}"></div>

            <div class="admin-table-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4" style="width: 80px;">STT</th>
                            <th style="width: 260px;">Tên danh mục</th>
                            <th> Mô tả</th>
                            <th class="text-end pe-4" style="width: 180px;"> Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="4" class="gs-empty-state">
                                <div class="gs-empty-state-icon"><i class="bi bi-tags"></i></div>
                                <div class="gs-empty-state-title">Chưa có danh mục nào</div>
                                <div class="gs-empty-state-text">Hệ thống chưa có danh mục nào.</div>
                            </td>
                        </tr>
                        <tr th:each="cat, stat : ${categories}">
                            <td class="ps-4 fw-bold gs-mono text-secondary" th:text="${stat.count}">1</td>
                            <td>
                                <span class="fw-semibold text-dark" th:text="${cat.categoryName}">Tên danh mục</span>
                            </td>
                            <td class="text-secondary small" th:text="${cat.description ?: 'Chưa có mô tả'}">Mô tả danh
                                mục
                            </td>
                            <td class="text-end pe-4 table-action">
                                <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                                   class="btn btn-outline-primary btn-sm me-1" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                    <form class="d-inline" th:action="@{/admin/categories/delete/{id}(id=${cat.id})}"
                                          method="post" data-confirm="Bạn có chắc chắn muốn xóa danh mục này?">
                                    </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>


</body>
</html>
