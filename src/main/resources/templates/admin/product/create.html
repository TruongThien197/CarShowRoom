<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Them phu tung | GearShift Admin')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<div class="container-fluid py-4">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('products')}"></aside>
        <main class="col-md-9 col-lg-10 px-md-4">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-4 border-bottom">
                <div>
                    <h1 class="h2 fw-bold text-dark">Them phu tung</h1>
                    <p class="text-secondary small mb-0">Gan san pham vao nhom phu tung va dong xe catalog. Khong lien quan xe ca nhan customer.</p>
                </div>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lai</a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/admin/products/create}" method="post">
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Ten phu tung *</label>
                                <input type="text" class="form-control form-control-lg" name="productName" required maxlength="200">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">SKU</label>
                                <input type="text" class="form-control form-control-lg" name="sku" placeholder="Tu sinh neu bo trong">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Nhom phu tung *</label>
                                <select class="form-select form-select-lg" name="categoryId" required>
                                    <option value="">Chon nhom</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}">Category</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Gia ban *</label>
                                <input type="number" step="1" min="0" class="form-control form-control-lg" name="price" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Ton kho *</label>
                                <input type="number" min="0" class="form-control form-control-lg" name="stockQuantity" value="10" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Trang thai</label>
                                <select class="form-select form-select-lg" name="status">
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Dong xe catalog</label>
                            <select class="form-select" name="carModelIds" multiple size="8">
                                <option th:each="model : ${carModels}" th:value="${model.id}"
                                        th:text="${model.brand + ' ' + model.modelName + ' ' + model.year}">Model</option>
                            </select>
                            <div class="form-text">Bo trong neu chua muon phan loai theo dong xe.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">URL hinh anh</label>
                            <input type="text" class="form-control" name="imageUrl" placeholder="/images/turbocharger.jpg hoac https://...">
                            <div class="form-text">Chap nhan duong dan noi bo nhu /images/turbocharger.jpg hoac URL day du.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Mo ta</label>
                            <textarea class="form-control" name="description" rows="4"></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary px-4">Huy</a>
                            <button type="submit" class="btn btn-primary px-5"><i class="bi bi-check2-circle me-1"></i>Luu</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
