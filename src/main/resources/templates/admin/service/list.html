<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Bookable Services | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('services')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
                <div>
                    <h1 class="admin-page-title mb-1"><i class="bi bi-tools me-2 text-primary"></i>Manage Bookable Services</h1>
                    <p class="text-secondary small mb-0">Services customers select when booking a repair, with duration and price range.</p>
                </div>
                <a class="btn btn-primary shadow-sm d-flex align-items-center gap-2" th:href="@{/admin/services/create}">
                    <i class="bi bi-plus-lg"></i><span>Add Service</span>
                </a>
            </div>

            <div th:replace="~{fragments/sidebar :: adminTabs('services')}"></div>

            <div class="admin-table-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Service</th>
                            <th>Description</th>
                            <th>Duration</th>
                            <th class="text-end">Price Range</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(services)}">
                            <td colspan="6" class="gs-empty-state">
                                <div class="gs-empty-state-icon"><i class="bi bi-tools"></i></div>
                                <div class="gs-empty-state-title">No services yet</div>
                                <div class="gs-empty-state-text">No services exist in the system yet.</div>
                            </td>
                        </tr>
                        <tr th:each="service : ${services}">
                            <td class="ps-4 fw-bold gs-mono text-secondary" th:text="${service.id}">1</td>
                            <td class="fw-semibold text-dark" th:text="${service.serviceName}">Service</td>
                            <td class="text-secondary small" th:text="${service.description ?: 'No description'}">Description</td>
                            <td class="gs-mono" th:text="${service.durationMinutes + ' min'}">60 min</td>
                            <td class="text-end fw-bold text-primary gs-mono"
                                th:text="${#numbers.formatDecimal(service.minPrice, 0, 'COMMA', 0, 'POINT') + ' - ' + #numbers.formatDecimal(service.maxPrice, 0, 'COMMA', 0, 'POINT') + ' VND'}">0 - 0 VND</td>
                            <td class="text-end pe-4 table-action">
                                <a class="btn btn-outline-primary btn-sm me-1" title="Edit" th:href="@{/admin/services/edit/{id}(id=${service.id})}">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a class="btn btn-outline-danger btn-sm" title="Delete" th:href="@{/admin/services/delete/{id}(id=${service.id})}"
                                   onclick="return confirm('Delete this service?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
