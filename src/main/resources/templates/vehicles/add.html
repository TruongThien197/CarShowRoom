<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Thêm xe | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('account')}"></div>

<main class="container py-5">
    <div class="row g-4">
        <aside th:replace="~{fragments/sidebar :: accountSidebar('vehicles')}"></aside>

        <section class="col-lg-9">
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h1 class="section-title mb-1">Thêm xe</h1>
                    <p class="text-secondary mb-0">Nhập thông tin xe của bạn.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/vehicles}">Quay lại</a>
            </div>

            <form class="surface-card p-4 needs-validation" th:action="@{/vehicles/add}" th:object="${vehicleForm}" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Hãng xe</label>
                        <input class="form-control" th:field="*{brand}" placeholder="VD: BMW, Toyota..." required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tên model</label>
                        <input class="form-control" th:field="*{modelName}" placeholder="VD: M4 G82, Supra GR..." required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Năm SX</label>
                        <input class="form-control" th:field="*{year}" type="number" min="1886" max="2030" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Biển số</label>
                        <input class="form-control" th:field="*{licensePlate}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"></div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary btn-lg" type="submit">
                            <i class="bi bi-car-front me-2"></i>Lưu xe
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
