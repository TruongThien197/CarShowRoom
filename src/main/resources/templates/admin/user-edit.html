<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit User | GearShift Pro')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('users')}"></aside>
        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="admin-page-title mb-1">Edit User</h1>
                    <p class="text-secondary mb-0 gs-mono" th:text="${user.email}">email@example.com</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Back</a>
            </div>

            <form class="surface-card gs-stripe-top p-4 p-md-5" th:action="@{/admin/users/edit/{id}(id=${user.id})}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full name</label>
                        <input class="form-control" type="text" name="txtFullName" th:value="${user.fullName}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control gs-mono" type="email" th:value="${user.email}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input class="form-control" type="text" name="txtPhone" th:value="${user.phone}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <select class="form-select" name="role">
                            <option value="CUSTOMER" th:selected="${user.role == 'CUSTOMER'}">CUSTOMER</option>
                            <option value="STAFF" th:selected="${user.role == 'STAFF'}">STAFF</option>
                            <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <input class="form-control" type="text" name="txtAddress" th:value="${user.address}">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary btn-lg" type="submit">
                            <i class="bi bi-save me-2"></i>Save Changes
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
