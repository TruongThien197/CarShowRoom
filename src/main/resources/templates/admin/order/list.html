<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order Management | GearShift Pro')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container-fluid">
    <div class="row">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('orders')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="admin-page-title mb-1">Order Management</h1>
                    <p class="text-secondary mb-0">Track orders, filter by status, and open a detail page to update processing.</p>
                </div>
                <a class="btn btn-outline-secondary align-self-start" th:href="@{/admin}">
                    <i class="bi bi-speedometer2 me-2"></i>Overview
                </a>
            </div>

            <form class="surface-card admin-filter-card p-3 p-md-4 mb-4" method="get" th:action="@{/admin/orders}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8 col-lg-10">
                        <label class="form-label" for="status">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="">All statuses</option>
                            <option value="PENDING_PAYMENT" th:selected="${selectedStatus == 'PENDING_PAYMENT'}">PENDING_PAYMENT</option>
                            <option value="PROCESSING" th:selected="${selectedStatus == 'PROCESSING'}">PROCESSING</option>
                            <option value="SHIPPING" th:selected="${selectedStatus == 'SHIPPING'}">SHIPPING</option>
                            <option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">COMPLETED</option>
                            <option value="CANCELED" th:selected="${selectedStatus == 'CANCELED'}">CANCELED</option>
                        </select>
                    </div>
                    <div class="col-md-4 col-lg-2 d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1" type="submit">
                            <i class="bi bi-funnel me-2"></i>Filter
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/orders}" aria-label="Clear filters">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </div>
            </form>

            <div class="admin-table-card p-0 overflow-hidden">
                <div class="p-3 border-bottom">
                    <input type="search" class="form-control" style="max-width: 320px"
                           placeholder="Search by customer, product..."
                           data-table-filter="#ordersTable" aria-label="Search orders">
                </div>
                <div class="table-responsive">
                    <table id="ordersTable" class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Code</th>
                            <th>Customer</th>
                            <th>Date Created</th>
                            <th>Product</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="gs-empty-state">
                                <div class="gs-empty-state-icon"><i class="bi bi-cart-check"></i></div>
                                <div class="gs-empty-state-title">No orders yet</div>
                                <div class="gs-empty-state-text">No orders match the current filter.</div>
                            </td>
                        </tr>
                        <tr th:each="order : ${orders}">
                            <td class="fw-bold gs-mono" th:text="${'ORD-' + order.id}">ORD-1</td>
                            <td>
                                <div class="fw-bold" th:text="${order.user.fullName}">Customer</div>
                                <div class="small text-secondary" th:text="${order.user.email}">email@example.com</div>
                            </td>
                            <td class="gs-mono" th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}">Date</td>
                            <td class="text-secondary" th:text="${orderItems[order.id] ?: 'No items'}">Items</td>
                            <td class="fw-bold text-primary gs-mono" th:text="${#numbers.formatDecimal(order.productTotal, 0, 'COMMA', 2, 'POINT')}">0</td>
                            <td>
                                <span class="gs-badge"
                                      th:classappend="${order.orderStatus.name() == 'COMPLETED'} ? 'gs-badge--success' : (${order.orderStatus.name() == 'CANCELED' or order.orderStatus.name() == 'EXPIRED_PAYMENT'} ? 'gs-badge--danger' : (${order.orderStatus.name() == 'PROCESSING' or order.orderStatus.name() == 'SHIPPING'} ? 'gs-badge--info' : 'gs-badge--neutral'))"
                                      th:text="${order.orderStatus}">PENDING</span>
                            </td>
                            <td class="text-end table-action">
                                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/orders/{id}(id=${order.id})}">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
