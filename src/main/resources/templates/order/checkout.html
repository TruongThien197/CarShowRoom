<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Secure Checkout | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments :: navbar('shop')}"></div>

<main class="container py-5">
    <h1 class="section-title mb-4">Xác nhận đơn hàng</h1>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(cartItems)}">
        Your cart is empty. <a th:href="@{/shop}">Continue shopping</a>.
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(cartItems)}">
        <div class="col-lg-8">
            <form class="surface-card p-4 needs-validation" th:action="@{/orders/checkout}" th:object="${checkoutForm}" method="post">
                <h4 class="fw-bold mb-3"><span class="step-pill me-2">1</span>Thông tin liên hệ & giao hàng</h4>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Full name</label>
                        <input class="form-control" type="text" th:value="${user.fullName}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" th:value="${user.email}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input class="form-control" type="tel" th:field="*{phone}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Shipping address</label>
                        <input class="form-control" type="text" th:field="*{shippingAddress}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></div>
                    </div>
                </div>
                <div th:if="${needsWorkshop}" class="mb-4">
                    <h4 class="fw-bold mb-3"><span class="step-pill me-2">2</span>Lich lap dat tai xuong</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Xe</label>
                            <select class="form-select" th:field="*{vehicleId}" required>
                                <option value="">Chon xe</option>
                                <option th:each="vehicle : ${vehicles}"
                                        th:value="${vehicle.id}"
                                        th:text="${vehicle.brand + ' ' + vehicle.modelName + ' ' + vehicle.year + ' - ' + vehicle.licensePlate}">Vehicle</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Dich vu</label>
                            <select class="form-select" th:field="*{serviceId}" required>
                                <option value="">Chon dich vu</option>
                                <option th:each="service : ${services}"
                                        th:value="${service.id}"
                                        th:text="${service.serviceName + ' - ' + #numbers.formatDecimal(service.minPrice, 0, 'COMMA', 0, 'POINT') + ' VND'}">Service</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ngay hen</label>
                            <input class="form-control" type="date" th:field="*{bookingDate}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Gio bat dau</label>
                            <input class="form-control" type="time" th:field="*{startTime}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Ghi chu</label>
                            <textarea class="form-control" rows="3" th:field="*{notes}"></textarea>
                        </div>
                    </div>
                </div>

                <h4 class="fw-bold mb-3"><span class="step-pill me-2" th:text="${needsWorkshop ? 3 : 2}">2</span>Thanh toán</h4>
                <div class="alert alert-info mb-4">
                    He thong tao giao dich coc 20% va giu kho/slot trong 15 phut. PayOS se duoc cau hinh sau khi co API.
                </div>
                <button class="btn btn-primary btn-lg" type="submit">Đặt hàng</button>
            </form>
        </div>
        <div class="col-lg-4">
            <div class="surface-card p-4">
                <h4 class="fw-bold">Đơn hàng của bạn</h4>
                <div class="d-flex justify-content-between my-3" th:each="item : ${cartItems}">
                    <span th:text="${item.product.productName + ' x' + item.quantity}">Product</span>
                    <strong th:text="${#numbers.formatDecimal(item.product.price.multiply(T(java.math.BigDecimal).valueOf(item.quantity.longValue())), 0, 'COMMA', 2, 'POINT')}">$0</strong>
                </div>
                <hr>
                <div class="d-flex justify-content-between fs-5 mb-4">
                    <span>Total</span>
                    <strong th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 2, 'POINT')}">$0</strong>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
