<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order Detail | Admin')}"></head>
<body>
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container py-5">
    <div class="mb-4">
        <a th:href="@{/admin/orders}" class="btn btn-link p-0 text-secondary mb-2 text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to list
        </a>
        <h1 class="h2 fw-bold" th:text="${'Order ' + '#' + order.id}">Order #1</h1>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="surface-card p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-truck me-2"></i>Shipping Information</h5>
                <p class="mb-1"><strong>Customer:</strong> <span th:text="${order.user.fullName}">Name</span></p>
                <p class="mb-1"><strong>Phone:</strong> <span th:text="${order.user.phone}">Phone</span></p>
                <p class="mb-0"><strong>Address:</strong> <span th:text="${order.shippingAddress}">Address</span></p>
            </div>

            <div class="surface-card p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-box-seam me-2"></i>Items Ordered</h5>
                <div class="table-responsive">
                    <table class="table table-borderless align-middle mb-0">
                        <thead>
                        <tr class="border-bottom text-secondary">
                            <th>Product</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-end">Price</th>
                            <th class="text-end">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.orderDetail}" class="border-bottom">
                            <td class="py-3">
                                <div class="fw-bold" th:text="${item.product.productName}">Product Name</div>
                                <small class="text-secondary" th:text="${item.product.category.categoryName}">Category</small>
                            </td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')}">$0</td>
                            <td class="text-end fw-bold text-primary"
                                th:text="${#numbers.formatDecimal(item.unitPrice.multiply(T(java.math.BigDecimal).valueOf(item.quantity.longValue())), 0, 'COMMA', 2, 'POINT')}">$0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="surface-card p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2"></i>Order Status</h5>
                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                    <div class="mb-3">
                        <select name="status" class="form-select">
                            <option value="PENDING" th:selected="${order.status == 'PENDING'}">PENDING</option>
                            <option value="PROCESSING" th:selected="${order.status == 'PROCESSING'}">PROCESSING</option>
                            <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">SHIPPED</option>
                            <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">DELIVERED</option>
                            <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">CANCELLED</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Status</button>
                </form>
            </div>

            <div class="surface-card p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-receipt me-2"></i>Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Order Date</span>
                    <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fs-5 fw-bold text-success">
                    <span>Total Amount</span>
                    <span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 2, 'POINT')}">$0</span>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
