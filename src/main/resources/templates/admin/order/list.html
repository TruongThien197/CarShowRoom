<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản lý đơn hàng | GearShift Pro')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container-fluid">
    <div class="row">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('orders')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="admin-page-title mb-1">Quản lý đơn hàng</h1>
                    <p class="text-secondary mb-0">Theo dõi đơn hàng, lọc theo trạng thái và mở trang chi tiết để cập nhật xử lý.</p>
                </div>
                <a class="btn btn-outline-secondary align-self-start" th:href="@{/admin}">
                    <i class="bi bi-speedometer2 me-2"></i>Tổng quan
                </a>
            </div>

            <form class="surface-card admin-filter-card p-3 p-md-4 mb-4" method="get" th:action="@{/admin/orders}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8 col-lg-10">
                        <label class="form-label" for="status"> Trạng thái </label>
                        <select class="form-select" id="status" name="status">
                            <option value="">Tất cả trạng thái</option>
                            <option value="PENDING_PAYMENT" th:selected="${selectedStatus == 'PENDING_PAYMENT'}">Chờ thanh toán</option>
                            <option value="PROCESSING" th:selected="${selectedStatus == 'PROCESSING'}">Đang xử lý</option>
                            <option value="SHIPPING" th:selected="${selectedStatus == 'SHIPPING'}">Đang giao hàng</option>
                            <option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">Hoàn tất</option>
                            <option value="CANCELED" th:selected="${selectedStatus == 'CANCELED'}">Đã hủy</option>
                        </select>
                    </div>
                    <div class="col-md-4 col-lg-2 d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1" type="submit">
                            <i class="bi bi-funnel me-2"></i>Lọc
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/orders}" aria-label="Xóa bộ lọc">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </div>
            </form>

            <div class="admin-table-card p-0 overflow-hidden">
                <div class="p-3 border-bottom">
                    <input type="search" class="form-control" style="max-width: 320px"
                           placeholder="Tìm theo khách hàng hoặc sản phẩm..."
                           data-table-filter="#ordersTable" aria-label="Tìm kiếm orders">
                </div>
                <div class="table-responsive">
                    <table id="ordersTable" class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>STT</th>
                            <th> Khách hàng </th>
                            <th>Ngày tạo</th>
                            <th> Sản phẩm </th>
                            <th> Tổng cộng </th>
                            <th> Trạng thái </th>
                            <th class="text-end"> Thao tác </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="gs-empty-state">
                                <div class="gs-empty-state-icon"><i class="bi bi-cart-check"></i></div>
                                <div class="gs-empty-state-title">Chưa có đơn hàng nào</div>
                                <div class="gs-empty-state-text">Không có đơn hàng phù hợp với bộ lọc hiện tại.</div>
                            </td>
                        </tr>
                        <tr th:each="order, stat : ${orders}">
                            <td class="fw-bold gs-mono" th:text="${stat.count}">1</td>
                            <td>
                                <div class="fw-bold" th:text="${order.user != null ? order.user.fullName : 'Không xác định'}">Khách hàng</div>
                                <div class="small text-secondary" th:text="${order.user != null ? order.user.email : 'Không có email'}">email@example.com</div>
                            </td>
                            <td class="gs-mono" th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm') : '—'}"> Ngày </td>
                            <td class="text-secondary" th:text="${orderItems[order.id] ?: 'Không có sản phẩm'}">Items</td>
<!--                            <td class="fw-bold text-primary gs-mono" th:text="${#numbers.formatDecimal(order.productTotal, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td>-->
                            <td class="fw-bold text-primary gs-mono"
                                th:text="${#numbers.formatDecimal(  order.productTotal + (order.shippingFee != null ? order.shippingFee : 0), 0, 'COMMA', 0, 'POINT' ) + ' VNĐ'}">0 VNĐ
                            </td>
                            <td>
                                <span class="gs-badge"
                                      th:classappend="${order.orderStatus.name() == 'COMPLETED'} ? 'gs-badge--success' : (${order.orderStatus.name() == 'CANCELED' or order.orderStatus.name() == 'EXPIRED_PAYMENT'} ? 'gs-badge--danger' : (${order.orderStatus.name() == 'PROCESSING' or order.orderStatus.name() == 'SHIPPING'} ? 'gs-badge--info' : 'gs-badge--neutral'))"
                                      th:text="${order.orderStatus}">Chờ xử lý</span>
                            </td>
                            <td class="text-end table-action">
                                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/orders/{id}(id=${order.id})}">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
