<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Cấu hình hệ thống | Quản trị')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>
<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('settings')}"></aside>
        <section class="col-lg-9 col-xl-10 admin-content">
            <h1 class="admin-page-title mb-1">Cấu hình hệ thống</h1>
            <p class="text-secondary mb-4">Các thay đổi chỉ áp dụng cho đơn hàng và lịch hẹn tạo sau thời điểm cập nhật.</p>
            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <form th:action="@{/admin/settings}" method="post" class="surface-card p-4">
                <div class="mb-4" th:each="group, groupStatus : ${settingGroups}" th:classappend="${groupStatus.last} ? 'mb-0' : ''">
                    <h5 class="fw-bold border-bottom pb-2 mb-3" th:text="${group.key}">Nhóm cấu hình</h5>
                    <div class="row g-3">
                        <div class="col-md-6" th:each="setting : ${group.value}">
                            <label class="form-label fw-semibold" th:text="${setting.description}">Mô tả</label>
                            <input class="form-control" th:name="${setting.key}" th:value="${setting.value}" required>
                        </div>
                    </div>
                </div>
                <div class="mt-4 d-flex justify-content-end">
                    <button class="btn btn-primary" type="submit"><i class="bi bi-save me-2"></i>Lưu cấu hình</button>
                </div>
            </form>
            <div class="surface-card p-4 mt-4">
                <h5 class="fw-bold mb-3">Ngày xưởng nghỉ</h5>
                <form class="row g-2 mb-3" th:action="@{/admin/settings/closed-dates}" method="post">
                    <div class="col-md-4"><input class="form-control" type="date" name="closedDate" required></div>
                    <div class="col-md-6"><input class="form-control" name="reason" placeholder="Lý do nghỉ (không bắt buộc)"></div>
                    <div class="col-md-2"><button class="btn btn-outline-primary w-100">Thêm ngày nghỉ</button></div>
                </form>
                <div class="table-responsive"><table class="table mb-0"><thead><tr><th>Ngày</th><th>Lý do</th><th></th></tr></thead><tbody>
                    <tr th:if="${#lists.isEmpty(closedDates)}"><td colspan="3" class="text-secondary">Chưa có ngày nghỉ.</td></tr>
                    <tr th:each="date : ${closedDates}"><td th:text="${date.closedDate}">Ngày</td><td th:text="${date.reason}">Lý do</td><td class="text-end"><form th:action="@{/admin/settings/closed-dates/{id}/delete(id=${date.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr>
                </tbody></table></div>
            </div>
            <div class="admin-table-card p-0 overflow-hidden mt-4">
                <div class="p-3 border-bottom fw-semibold">Lịch sử thay đổi gần đây</div>
                <div class="table-responsive"><table class="table align-middle mb-0">
                    <thead class="table-light"><tr><th>Cấu hình</th><th>Giá trị cũ</th><th>Giá trị mới</th><th>Người sửa</th><th>Thời điểm</th></tr></thead>
                    <tbody><tr th:if="${#lists.isEmpty(settingAudits)}"><td colspan="5" class="text-secondary">Chưa có thay đổi nào.</td></tr>
                    <tr th:each="audit : ${settingAudits}"><td th:text="${settingLabels[audit.settingKey]}">Cấu hình</td><td th:text="${audit.oldValue}">Cũ</td><td th:text="${audit.newValue}">Mới</td><td th:text="${audit.updatedBy != null ? audit.updatedBy.fullName : 'Hệ thống'}">Admin</td><td th:text="${#temporals.format(audit.updatedAt, 'dd-MM-yyyy HH:mm')}">Thời gian</td></tr></tbody>
                </table></div>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
