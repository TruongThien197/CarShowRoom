<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Vehicles | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('account')}"></div>

<main class="container py-5">
    <div class="row g-4">
        <aside th:replace="~{fragments/sidebar :: accountSidebar('vehicles')}"></aside>

        <section class="col-lg-9">
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h1 class="gs-h1 section-title mb-1">My Vehicles</h1>
                    <p class="text-secondary mb-0">Manage the vehicles used for your service bookings.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/vehicles/add}">
                    <i class="bi bi-plus-lg me-2"></i>Add Vehicle
                </a>
            </div>

            <div class="gs-empty-state surface-card" th:if="${#lists.isEmpty(vehicles)}">
                <i class="bi bi-car-front gs-empty-state-icon"></i>
                <div class="gs-empty-state-title">You have not added any vehicles yet</div>
                <p class="gs-empty-state-text mb-0">Add your vehicles for faster service booking.</p>
            </div>

            <div class="row g-3" th:if="${!#lists.isEmpty(vehicles)}">
                <div class="col-md-6" th:each="vehicle : ${vehicles}">
                    <div class="surface-card gs-stripe-top p-4 h-100">
                        <div class="d-flex justify-content-between gap-3">
                            <div>
                                <h5 class="fw-bold mb-1" th:text="${vehicle.brand + ' ' + vehicle.modelName}">Car</h5>
                                <div class="text-secondary" th:text="${vehicle.year}">2024</div>
                            </div>
                            <span class="gs-mono badge text-bg-light align-self-start" th:text="${vehicle.licensePlate}">Plate</span>
                        </div>
                        <form class="mt-4" th:action="@{/vehicles/{id}/delete(id=${vehicle.id})}" method="post">
                            <button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Delete this vehicle?')">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
