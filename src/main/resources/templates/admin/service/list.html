<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quan ly dich vu booking | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('services')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
                <div>
                    <h1 class="admin-page-title mb-1"><i class="bi bi-tools me-2 text-primary"></i>Quan ly dich vu booking</h1>
                    <p class="text-secondary mb-0">Dich vu customer chon khi dat lich sua xe, kem thoi luong va khoang gia.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/services/create}">
                    <i class="bi bi-plus-lg me-2"></i>Them dich vu
                </a>
            </div>

            <div th:replace="~{fragments/sidebar :: adminTabs('services')}"></div>

            <div class="surface-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Dich vu</th>
                            <th>Mo ta</th>
                            <th>Thoi luong</th>
                            <th class="text-end">Khoang gia</th>
                            <th class="text-end pe-4">Thao tac</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(services)}">
                            <td colspan="6" class="text-center py-5 text-secondary">Chua co dich vu nao.</td>
                        </tr>
                        <tr th:each="service : ${services}">
                            <td class="ps-4 fw-bold" th:text="${service.id}">1</td>
                            <td class="fw-semibold" th:text="${service.serviceName}">Service</td>
                            <td class="text-secondary" th:text="${service.description ?: 'Khong co mo ta'}">Description</td>
                            <td th:text="${service.durationMinutes + ' phut'}">60 phut</td>
                            <td class="text-end fw-bold text-primary"
                                th:text="${#numbers.formatDecimal(service.minPrice, 0, 'COMMA', 0, 'POINT') + ' - ' + #numbers.formatDecimal(service.maxPrice, 0, 'COMMA', 0, 'POINT') + ' VND'}">0 - 0 VND</td>
                            <td class="text-end pe-4">
                                <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/services/edit/{id}(id=${service.id})}">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a class="btn btn-outline-danger btn-sm" th:href="@{/admin/services/delete/{id}(id=${service.id})}"
                                   onclick="return confirm('Xoa dich vu nay?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
