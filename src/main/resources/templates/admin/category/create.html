<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Thêm Danh Mục Mới | GearShift Admin')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<div class="container-fluid py-4">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('categories')}"></aside>

        <main class="col-md-9 col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <div>
                    <h1 class="h2 fw-bold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Thêm Danh Mục Phụ Tùng</h1>
                    <p class="text-secondary small mb-0">Tạo danh mục mới để phân loại sản phẩm trong hệ thống.</p>
                </div>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                        <i class="bi bi-arrow-left"></i>
                        <span>Quay Lại Danh Sách</span>
                    </a>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/admin/categories/create}" method="post">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Tên Danh Mục <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-lg" name="categoryName" placeholder="Ví dụ: Phụ tùng động cơ, Hệ thống phanh..." required maxlength="100">
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Mô Tả Danh Mục</label>
                                    <textarea class="form-control" name="description" rows="4" placeholder="Nhập mô tả chi tiết về nhóm phụ tùng này..."></textarea>
                                </div>

                                <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary px-4">Hủy</a>
                                    <button type="submit" class="btn btn-primary px-5 shadow-sm d-flex align-items-center gap-2">
                                        <i class="bi bi-check2-circle"></i>
                                        <span>Lưu Danh Mục</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
