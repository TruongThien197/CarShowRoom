<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thêm người dùng | GearShift Pro')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('users')}"></aside>
        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="admin-page-title mb-1">Thêm người dùng</h1>
                    <p class="text-secondary mb-0">Tạo tài khoản khách hàng, nhân viên hoặc quản trị viên.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Quay lại </a>
            </div>

            <form class="surface-card gs-stripe-top p-4 p-md-5" th:action="@{/admin/users/create}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label"> Họ và tên </label>
                        <input class="form-control" type="text" name="txtFullName" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"> Email </label>
                        <input class="form-control" type="email" name="txtEmail" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"> Mật khẩu </label>
                        <input class="form-control" type="password" name="txtPassword" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"> Số điện thoại </label>
                        <input class="form-control" type="text" name="txtPhone">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label"> Địa chỉ </label>
                        <input class="form-control" type="text" name="txtAddress">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label"> Vai trò </label>
                        <select class="form-select" name="role">
                            <option value="CUSTOMER">Khách hàng</option>
                            <option value="STAFF">Nhân viên</option>
                            <option value="ADMIN">Quản trị viên</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary btn-lg" type="submit">
                            <i class="bi bi-person-plus me-2"></i>Tạo mới User
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
