<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Tra cứu phụ tùng | GearShift Pro')}"></head><body class="ops-shell"><div th:replace="~{fragments :: navbar('staff')}"></div>
<main class="container-fluid"><div class="row"><aside class="col-lg-3 col-xl-2 ops-sidebar p-4"><h5 class="text-white fw-bold mb-4">Khu vực nhân viên</h5><nav class="d-grid gap-2"><a th:href="@{/staff}"><i class="bi bi-grid"></i> Tổng quan</a><a th:href="@{/staff/bookings}"><i class="bi bi-calendar-check"></i> Lịch hẹn</a><a th:href="@{/staff/orders}"><i class="bi bi-receipt-cutoff"></i> Xử lý đơn hàng</a><a class="active" th:href="@{/staff/parts}"><i class="bi bi-search"></i> Tra cứu phụ tùng</a></nav></aside>
    <section class="col-lg-9 col-xl-10 p-4 p-lg-5"><h1 class="gs-h1 mb-1">Tra cứu phụ tùng</h1><p class="text-secondary mb-4">Tìm phụ tùng tương thích để tư vấn cho khách hàng.</p><form class="surface-card p-4 row g-3 mb-4" method="get" th:action="@{/staff/parts}"><div class="col-md-3"><label class="form-label">Hãng xe</label><select class="form-select" name="brand"><option value="">Tất cả hãng xe</option><option th:each="brand : ${carBrands}" th:value="${brand}" th:text="${brand}" th:selected="${brand == selectedBrand}">Hãng</option></select></div><div class="col-md-4"><label class="form-label">Dòng xe</label><select class="form-select" name="carModelId"><option value="">Tất cả dòng xe</option><option th:each="model : ${carModels}" th:value="${model.id}" th:text="${model.brand + ' ' + model.modelName + ' ' + model.year}" th:selected="${model.id == selectedCarModelId}">Dòng xe</option></select></div><div class="col-md-3"><label class="form-label">Từ khóa</label><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tên phụ tùng"></div><div class="col-md-2 d-grid align-self-end"><button class="btn btn-primary" type="submit">Tìm kiếm</button></div></form><div class="admin-table-card p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Phụ tùng</th><th>Danh mục</th><th>Dòng xe tương thích</th><th class="text-end">Giá</th><th class="text-center">Tồn kho</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(products)}"><td colspan="5" class="gs-empty-state">Không tìm thấy phụ tùng phù hợp.</td></tr><tr th:each="product : ${products}"><td><strong th:text="${product.name}">Phụ tùng</strong><div class="small text-secondary" th:text="${product.description}">Mô tả</div></td><td th:text="${product.category.categoryName}">Danh mục</td><td><span th:each="model, stat : ${product.compatibleCarModels}" th:text="${model.brand + ' ' + model.modelName + (stat.last ? '' : ', ')}">Dòng xe</span></td><td class="text-end gs-mono" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td><td class="text-center" th:text="${product.stockQuantity}">0</td></tr></tbody></table></div></div></section></div></main><div th:replace="~{fragments :: scripts}"></div></body></html>
