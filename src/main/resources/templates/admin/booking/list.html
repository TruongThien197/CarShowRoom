<!DOCTYPE html>
<head><meta charset="UTF-8"></head>

<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quản lý lịch hẹn | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('bookings')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
                <div>
                    <h1 class="admin-page-title mb-1"><i class="bi bi-calendar-check me-2 text-primary"></i>Quản lý lịch hẹn</h1>
                    <p class="text-secondary mb-0">Theo dõi và cập nhật trạng thái lịch hẹn của khách hàng.</p>
                </div>
            </div>

            <div th:replace="~{fragments/sidebar :: adminTabs('bookings')}"></div>

            <div class="admin-table-card p-0 overflow-hidden">
                <div class="p-3 border-bottom">
                    <input type="search" class="form-control" style="max-width: 360px"
                           placeholder="Tìm kiếm by customer, vehicle, or status..."
                           data-table-filter="#bookingsTable" aria-label="Tìm kiếm bookings">
                </div>
                <div class="table-responsive">
                    <table id="bookingsTable" class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">STT</th>
                            <th> Khách hàng </th>
                            <th> Xe </th>
                            <th>Ngày tạo lịch</th>
                            <th>Ngày và giờ</th>
                            <th> Dịch vụ </th>
                            <th> Trạng thái </th>
                            <th class="text-end pe-4"> Thao tác </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="8" class="gs-empty-state">
                                <div class="gs-empty-state-icon"><i class="bi bi-calendar-check"></i></div>
                                <div class="gs-empty-state-title">Chưa có lịch hẹn</div>
                                <div class="gs-empty-state-text">Chưa có lịch hẹn nào được tạo.</div>
                            </td>
                        </tr>
                        <tr th:each="booking, stat : ${bookings}">
                            <td class="ps-4 fw-bold gs-mono" th:text="${stat.count}">1</td>
                            <td>
                                <div class="fw-semibold" th:text="${booking.user.fullName}"> Khách hàng </div>
                                <small class="text-secondary" th:text="${booking.user.email}">email</small>
                            </td>
                            <td th:text="${booking.vehicle != null ? booking.vehicle.licensePlate : 'Chưa chọn xe'}"> Xe </td>
                            <td class="gs-mono text-nowrap"
                                th:text="${booking.createdAt != null ? #temporals.format(booking.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">21/07/2026 14:30</td>
                            <td class="gs-mono" th:text="${booking.bookingDate + ' - ' + booking.timeSlot}"> Ngày </td>
                            <td th:text="${bookingServices[booking.id]}"> Dịch vụ </td>
                            <td>
                                <span class="gs-badge"
                                      th:classappend="${booking.bookingStatus.name() == 'COMPLETED'} ? 'gs-badge--success' : (${booking.bookingStatus.name() == 'CANCELED' or booking.bookingStatus.name() == 'EXPIRED_PAYMENT' or booking.bookingStatus.name() == 'EXPIRED_NO_SHOW'} ? 'gs-badge--danger' : (${booking.bookingStatus.name() == 'CONFIRMED'} ? 'gs-badge--info' : (${booking.bookingStatus.name() == 'IN_PROGRESS' or booking.bookingStatus.name() == 'PENDING_APPROVAL'} ? 'gs-badge--warning' : 'gs-badge--neutral')))"
                                      th:text="${booking.bookingStatus.name() == 'PENDING_PAYMENT' ? 'Chờ thanh toán' : (booking.bookingStatus.name() == 'CONFIRMED' ? 'Đã xác nhận' : (booking.bookingStatus.name() == 'IN_PROGRESS' ? 'Đang thực hiện' : (booking.bookingStatus.name() == 'COMPLETED' ? 'Hoàn tất' : (booking.bookingStatus.name() == 'CANCELED' ? 'Đã hủy' : 'Hết hạn'))))}">Chờ xử lý</span>
                                <div class="small text-warning fw-semibold"
                                     th:if="${booking.refundStatus != null and booking.refundStatus.name() == 'REQUESTED'}">
                                    <i class="bi bi-arrow-counterclockwise me-1"></i>Chờ hoàn cọc
                                </div>
                            </td>
                            <td class="text-end pe-4 table-action">
                                <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/bookings/{id}(id=${booking.id})}">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a class="btn btn-warning btn-sm"
                                   th:if="${booking.refundStatus != null and booking.refundStatus.name() == 'REQUESTED'}"
                                   th:href="@{/admin/bookings/{id}(id=${booking.id})}">
                                    <i class="bi bi-arrow-counterclockwise me-1"></i>Hoàn tiền
                                </a>
                                <form class="d-inline" th:action="@{/admin/bookings/status}" method="post">
                                    <input type="hidden" name="bookingId" th:value="${booking.id}">
                                    <input type="hidden" name="status" value="CANCELED">
                                    <button class="btn btn-outline-danger btn-sm" type="submit"> Từ chối / hủy </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
