<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sửa dịch vụ | GearShift Admin')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<div class="container-fluid py-4">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('services')}"></aside>

        <main class="col-md-9 col-lg-10 px-md-4">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2 fw-bold" th:text="'Sửa dịch vụ #' + ${service.id}">Sửa dịch vụ</h1>
                <a class="btn btn-outline-secondary" th:href="@{/admin/services}">Quay lại</a>
            </div>

            <form class="card border-0 shadow-sm rounded-4 p-4" th:action="@{/admin/services/edit/{id}(id=${service.id})}" th:object="${serviceForm}" method="post">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Tên dịch vụ</label>
                        <input class="form-control" th:field="*{serviceName}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('serviceName')}" th:errors="*{serviceName}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá</label>
                        <input class="form-control" type="number" min="0" step="0.01" th:field="*{price}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Cập nhật</button>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
