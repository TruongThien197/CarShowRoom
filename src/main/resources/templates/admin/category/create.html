<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Add New Category | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<main class="container-fluid admin-page">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('categories')}"></aside>

        <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3">
                <div>
                    <h1 class="gs-h1 mb-1"><i class="bi bi-plus-circle me-2 text-primary"></i>Thêm danh mục phụ tùng</h1>
                    <p class="text-secondary small mb-0">Tạo danh mục mới để phân loại sản phẩm trong hệ thống.</p>
                </div>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                        <i class="bi bi-arrow-left"></i>
                        <span>Quay lại danh sách</span>
                    </a>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <form class="surface-card gs-stripe-top p-4 p-md-5" th:action="@{/admin/categories/create}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" name="categoryName" placeholder="e.g. Engine Parts, Brake System..." required maxlength="100">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Mô tả danh mục</label>
                            <textarea class="form-control" name="description" rows="4" placeholder="Enter a detailed description of this parts group..."></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary px-4"> Hủy </a>
                            <button type="submit" class="btn btn-primary px-5 shadow-sm d-flex align-items-center gap-2">
                                <i class="bi bi-check2-circle"></i>
                                <span>Lưu danh mục</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>

</body>
</html>
