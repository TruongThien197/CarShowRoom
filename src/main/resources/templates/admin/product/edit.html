<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Chỉnh Sửa Phụ Tùng | GearShift Admin')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar('admin')}"></div>

<div class="container-fluid py-4">
    <div class="row min-vh-100">
        <aside th:replace="~{fragments/sidebar :: adminSidebar('products')}"></aside>

        <main class="col-md-9 col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <div>
                    <h1 class="h2 fw-bold text-dark"><i class="bi bi-pencil-square me-2 text-primary"></i>Chỉnh Sửa Phụ Tùng</h1>
                    <p class="text-secondary small mb-0" th:text="'Cập nhật thông tin phụ tùng ID: #' + ${product.id}">Cập nhật phụ tùng.</p>
                </div>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                        <i class="bi bi-arrow-left"></i>
                        <span>Quay Lại Danh Sách</span>
                    </a>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/admin/products/edit/{id}(id=${product.id})}" method="post">
                                <div class="row g-4 mb-4">
                                    <div class="col-md-2">
                                        <label class="form-label fw-semibold text-dark">ID</label>
                                        <input type="text" class="form-control form-control-lg bg-light" th:value="${product.id}" readonly disabled>
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label fw-semibold text-dark">Tên Phụ Tùng <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control form-control-lg" name="productName" th:value="${product.productName}" required maxlength="200">
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label fw-semibold text-dark">Danh Mục <span class="text-danger">*</span></label>
                                        <select class="form-select form-select-lg" name="categoryId" required>
                                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}"
                                                    th:selected="${product.category != null and product.category.id == cat.id}">Category</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-4 mb-4">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold text-dark">Giá Bán (VNĐ) <span class="text-danger">*</span></label>
                                        <input type="number" step="1" min="0" class="form-control form-control-lg" name="price" th:value="${product.price}" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold text-dark">Số Lượng Kho <span class="text-danger">*</span></label>
                                        <input type="number" min="0" class="form-control form-control-lg" name="stockQuantity" th:value="${product.stockQuantity}" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold text-dark">Trạng Thái <span class="text-danger">*</span></label>
                                        <select class="form-select form-select-lg" name="status">
                                            <option value="ACTIVE" th:selected="${'ACTIVE'.equalsIgnoreCase(product.status)}">ACTIVE (Đang bán)</option>
                                            <option value="INACTIVE" th:selected="${'INACTIVE'.equalsIgnoreCase(product.status)}">INACTIVE (Tạm ngưng)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Đường Dẫn Hình Ảnh (URL)</label>
                                    <input type="url" class="form-control" name="imageUrl" th:value="${product.imageUrl}">
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Mô Tả Sản Phẩm</label>
                                    <textarea class="form-control" name="description" rows="4" th:text="${product.description}"></textarea>
                                </div>

                                <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary px-4">Hủy</a>
                                    <button type="submit" class="btn btn-primary px-5 shadow-sm d-flex align-items-center gap-2">
                                        <i class="bi bi-check2-circle"></i>
                                        <span>Cập Nhật Phụ Tùng</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
