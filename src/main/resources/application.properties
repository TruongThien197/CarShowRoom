spring.application.name=CarShowRoom
spring.config.import=optional:file:.env[.properties]

server.port=8386

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CarShowRoom;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8386/payments/payos/return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8386/payments/payos/cancel}
payos.webhook-url=${PAYOS_WEBHOOK_URL:}

payos.payout.client-id=${PAYOS_PAYOUT_CLIENT_ID:}
payos.payout.api-key=${PAYOS_PAYOUT_API_KEY:}
payos.payout.checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY:}
payos.payout.base-url=${PAYOS_PAYOUT_BASE_URL:https://api-merchant.payos.vn}

firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
