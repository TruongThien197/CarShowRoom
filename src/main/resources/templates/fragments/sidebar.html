<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 1. Sidebar lọc danh mục cho trang Shop -->
<aside th:fragment="shopSidebar" class="col-lg-3 col-xl-2 apex-sidebar p-3 p-md-4 border-end bg-light min-vh-100">
    <div class="surface-card p-3 mb-4 bg-primary text-white rounded shadow-sm">
        <div class="small opacity-75">DANH MỤC SẢN PHẨM</div>
        <div class="fw-bold fs-6">Phụ Tùng Ô Tô</div>
    </div>
    <div class="list-group list-group-flush rounded shadow-sm">
        <a class="list-group-item list-group-item-action d-flex align-items-center"
           th:classappend="${selectedCategoryId == null} ? 'active fw-semibold'" th:href="@{/shop}">
            <i class="bi bi-grid me-2"></i>Tất cả danh mục
        </a>
        <a class="list-group-item list-group-item-action d-flex align-items-center justify-content-between"
           th:each="category : ${categories}"
           th:classappend="${selectedCategoryId == category.id} ? 'active fw-semibold'"
           th:href="@{/shop(categoryId=${category.id})}">
            <span>
                <i class="bi bi-gear-wide-connected me-2"></i>
                <span th:text="${category.categoryName}">Category</span>
            </span>
        </a>
    </div>
</aside>

<!-- 2. Unified sidebar for Admin Panel -->
<aside th:fragment="adminSidebar(activeMenu)" class="col-lg-3 col-xl-2 ops-sidebar p-3 p-lg-4">
    <div class="admin-brand fw-bold">
        <i class="bi bi-shield-lock me-2"></i>Admin Panel
    </div>
    <nav class="d-grid gap-2">
        <a th:classappend="${activeMenu == 'dashboard'} ? 'active'" th:href="@{/admin}">
            <i class="bi bi-speedometer2"></i>Tổng quan
        </a>
        <a th:classappend="${activeMenu == 'users'} ? 'active'" th:href="@{/admin/users}">
            <i class="bi bi-people"></i>Người dùng
        </a>
        <a th:classappend="${activeMenu == 'categories'} ? 'active'" th:href="@{/admin#products}">
            <i class="bi bi-tags"></i>Danh mục
        </a>
        <a th:classappend="${activeMenu == 'products'} ? 'active'" th:href="@{/admin#products}">
            <i class="bi bi-box-seam"></i>Sản phẩm
        </a>
        <a th:classappend="${activeMenu == 'services'} ? 'active'" th:href="@{/admin/services}">
            <i class="bi bi-tools"></i>Dịch vụ sửa xe
        </a>
        <a th:classappend="${activeMenu == 'orders'} ? 'active'" th:href="@{/admin/orders}">
            <i class="bi bi-cart-check"></i>Đơn hàng
        </a>
        <a th:classappend="${activeMenu == 'bookings'} ? 'active'" th:href="@{/admin/bookings}">
            <i class="bi bi-calendar-check"></i>Lịch đặt sửa
        </a>
    </nav>
</aside>
<!-- 3. Sidebar điều hướng cho Account Khách hàng -->
<aside th:fragment="accountSidebar(activeTab)" class="col-lg-3 mb-4">
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="card-body bg-primary text-white p-4 text-center">
            <i class="bi bi-person-circle display-4 mb-2 d-block"></i>
            <h5 class="fw-bold mb-0" th:text="${currentUser != null ? currentUser.fullName : 'Tài khoản'}">Họ tên</h5>
            <small class="opacity-75" th:text="${currentUser != null ? currentUser.email : ''}">email@domain.com</small>
        </div>
        <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action p-3" th:classappend="${activeTab == 'profile'} ? 'active fw-semibold'" th:href="@{/account}">
                <i class="bi bi-person me-2"></i>Hồ sơ của tôi
            </a>
            <a class="list-group-item list-group-item-action p-3" th:classappend="${activeTab == 'orders'} ? 'active fw-semibold'" th:href="@{/orders}">
                <i class="bi bi-bag me-2"></i>Đơn hàng phụ tùng
            </a>
            <a class="list-group-item list-group-item-action p-3" th:classappend="${activeTab == 'bookings'} ? 'active fw-semibold'" th:href="@{/booking/my-bookings}">
                <i class="bi bi-calendar3 me-2"></i>Lịch đặt sửa xe
            </a>
            <a class="list-group-item list-group-item-action p-3" th:classappend="${activeTab == 'vehicles'} ? 'active fw-semibold'" th:href="@{/vehicles}">
                <i class="bi bi-car-front me-2"></i>Xe của tôi
            </a>
        </div>
    </div>
</aside>
</body>
</html>
