<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cấu hình phí ship | GearShift Admin')}"></head>
<body class="ops-shell admin-fixed-shell">
<div th:replace="~{fragments :: navbar('admin')}"></div>
<main class="container-fluid"><div class="row">
    <aside th:replace="~{fragments/sidebar :: adminSidebar('shipping-fees')}"></aside>
    <section class="col-lg-9 col-xl-10 admin-content p-4 p-lg-5">
        <h1 class="admin-page-title mb-1"><i class="bi bi-truck me-2 text-primary"></i>Cấu hình phí giao hàng</h1>
        <p class="text-secondary mb-4">Phí được áp dụng theo tỉnh/thành phố và quận/huyện khi khách thanh toán. Các đơn đã tạo giữ nguyên phí đã chốt.</p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form class="surface-card p-4 row g-3 mb-4" th:action="@{/admin/shipping-fees}" method="post">
            <div class="col-md-4"><label class="form-label" for="province">Tỉnh/thành phố</label><input id="province" class="form-control" name="province" required></div>
            <div class="col-md-4"><label class="form-label" for="district">Quận/huyện</label><input id="district" class="form-control" name="district" required></div>
            <div class="col-md-2"><label class="form-label" for="fee">Phí ship (VNĐ)</label><input id="fee" class="form-control" type="number" min="0" step="1000" name="fee" required></div>
            <div class="col-md-2 d-grid align-self-end"><button class="btn btn-primary" type="submit">Thêm rule</button></div>
        </form>

        <div class="admin-table-card p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0">
            <thead class="table-light"><tr><th>Tỉnh/thành phố</th><th>Quận/huyện</th><th class="text-end">Phí ship</th><th>Trạng thái</th><th class="text-end">Lưu</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(shippingFeeRules)}"><td colspan="5" class="gs-empty-state">Chưa có rule phí ship nào.</td></tr>
            <tr th:each="rule : ${shippingFeeRules}">
                <td><form th:id="${'shipping-fee-form-' + rule.id}" th:action="@{/admin/shipping-fees/{id}(id=${rule.id})}" method="post"></form><span th:text="${rule.province}">Tỉnh</span></td><td th:text="${rule.district}">Quận</td>
                <td><input class="form-control text-end" type="number" min="0" step="1000" name="fee" th:value="${rule.fee}" th:attr="form=${'shipping-fee-form-' + rule.id}" required></td>
                <td><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${rule.active}" th:id="${'active-' + rule.id}" th:attr="form=${'shipping-fee-form-' + rule.id}"><label class="form-check-label" th:for="${'active-' + rule.id}" th:text="${rule.active ? 'Đang áp dụng' : 'Tạm ngưng'}">Đang áp dụng</label></div></td>
                <td class="text-end"><button class="btn btn-outline-primary btn-sm" th:attr="form=${'shipping-fee-form-' + rule.id}" type="submit">Lưu</button></td>
            </tr>
            </tbody>
        </table></div></div>
    </section>
</div></main>
<div th:replace="~{fragments :: scripts}"></div>
</body></html>
