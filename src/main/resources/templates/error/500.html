<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<main class="container py-5 text-center">

        <p class="text-secondary mb-4 mx-auto" style="max-width: 480px">

        </p>
        <div class="d-flex justify-content-center gap-3">
            <a class="btn btn-primary btn-lg" th:href="@{/}"><i class="bi bi-house-door me-2"></i>Về trang chủ</a>
            <a class="btn btn-outline-primary btn-lg" href="javascript:location.reload()"><i class="bi bi-arrow-clockwise me-2"></i>Thử lại</a>
        </div>
    </div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
