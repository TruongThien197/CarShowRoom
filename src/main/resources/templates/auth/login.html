<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login | GearShift Pro')}"></head>
<body>
<div th:replace="~{fragments :: navbar('login')}"></div>

<main class="auth-shell d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-end">
            <div class="col-md-7 col-lg-5">
                <form class="surface-card p-4 p-md-5 needs-validation" th:action="@{/auth/login}" method="post">
                    <h1 class="section-title mb-2">Welcome back</h1>
                    <p class="text-secondary mb-4">Sign in to manage bookings, orders, and your garage.</p>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control form-control-lg" type="email" name="txtEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input class="form-control form-control-lg" type="password" name="txtPassword" required>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
                    <p class="text-center mt-4 mb-0">New customer? <a th:href="@{/auth/register}">Create account</a></p>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
